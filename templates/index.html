<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Hệ thống điểm danh</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f6ff;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            background: white;
            width: 420px;
            margin: auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 15px #ccc;
        }

        select,
        button {
            width: 90%;
            padding: 12px;
            margin-top: 15px;
            font-size: 16px;
        }

        button {
            background: #2ecc71;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 8px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .modal-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .modal-box h3 {
            margin-top: 0;
        }

        .modal-box button {
            width: auto;
            padding: 10px 18px;
            margin-top: 18px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Hệ thống điểm danh sinh viên</h2>

        <form action="/start" method="POST">
            <select name="shift">
                {% for shift in shifts %}
                <option value="{{ shift }}">{{ shift }}</option>
                {% endfor %}
            </select>

            <button type="submit">Bắt đầu điểm danh</button>
        </form>
    </div>

    {% if message %}
    <div class="modal-overlay" id="popupOverlay">
        <div class="modal-box">
            <h3>Thông báo</h3>
            <p>{{ message }}</p>
            <button id="closePopup">Đóng</button>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var overlay = document.getElementById("popupOverlay");
            var closeBtn = document.getElementById("closePopup");

            if (overlay) {
                overlay.style.display = "flex";
            }

            if (closeBtn) {
                closeBtn.addEventListener("click", function () {
                    overlay.style.display = "none";
                });
            }
        });
    </script>
    {% endif %}
</body>

</html>
